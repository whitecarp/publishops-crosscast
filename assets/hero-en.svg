    <text x="862" y="371" font-size="15" fill="#4b566e">English</text>
    <rect x="1015.0" y="354.0" width="105.0" height="24" rx="6" fill="#e7edff" stroke="#7f9ceb" stroke-width="1.5"/>
      <circle cx="1027.5" cy="366" r="4.5" fill="none" stroke="#1d47c4" stroke-width="1.5"/>
