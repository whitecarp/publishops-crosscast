<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">PublishOps CrossCast</title>
  <desc id="d">One message. Every platform you choose. Left: the one message you send your AI assistant. Right: an example release plan where Bilibili and YouTube are verified, Douyin is submitted and unverified, Instagram is publishing and X is queued.</desc>
  <defs>
    <clipPath id="card"><rect x="620" y="56" width="524" height="448" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#17213a"/>
  <g font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Noto Sans',sans-serif">
    <g transform="translate(56 50)">
      <rect width="40" height="40" rx="10" fill="#eef2f8"/>
      <circle cx="11.9" cy="20" r="4.25" fill="#17213a"/>
      <path d="M16.9 20 30.6 9.4M16.9 20 30.6 14.7M16.9 20H30.6M16.9 20 30.6 25.3M16.9 20 30.6 30.6" stroke="#17213a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <text x="54" y="28" font-size="24" font-weight="800" fill="#eef2f8" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Noto Sans',sans-serif">PublishOps CrossCast</text>
    </g>
    <text x="56" y="166" font-size="46" font-weight="800" fill="#ffffff">One message.</text>
    <text x="56" y="220" font-size="46" font-weight="800" fill="#ffffff">Every platform</text>
    <text x="56" y="274" font-size="46" font-weight="800" fill="#ffffff">you choose.</text>
    <text x="56" y="336" font-size="20" fill="#b9c3d6">Your AI assistant writes each platform's copy,</text>
    <text x="56" y="366" font-size="20" fill="#b9c3d6">then submits platform by platform, with receipts.</text>
    <rect x="56" y="402" width="504" height="84" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="76" y="432" font-size="14" font-weight="600" fill="#8e9ab3">You tell your AI assistant</text>
    <text x="76" y="464" font-size="20" font-weight="700" fill="#eef2f8">“Publish final.mp4 publicly to all five.”</text>
    <text x="56" y="514" font-size="15" fill="#8e9ab3">0.3.0 alpha: web posting needs a browser-capable AI assistant</text>
    <g clip-path="url(#card)">
      <rect x="620" y="56" width="524" height="448" fill="#ffffff"/>
      <rect x="620" y="444" width="524" height="60" fill="#eef1f6"/>
    </g>
