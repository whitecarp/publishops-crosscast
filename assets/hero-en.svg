    <text x="862" y="423" font-size="15" fill="#4b566e">English</text>
    <rect x="1043.8" y="406.0" width="76.2" height="24" rx="6" fill="#eef1f6" stroke="#8e99ae" stroke-width="1.5" stroke-dasharray="4 3"/>
