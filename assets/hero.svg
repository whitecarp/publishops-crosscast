    <text x="76" y="434" font-size="20" font-weight="700" fill="#eef2f8">“把 final.mp4 公开发到这五个平台。”</text>
    <text x="56" y="504" font-size="15" fill="#8e9ab3">0.3.0 alpha：网页提交需要能操作浏览器的 AI 助手</text>
