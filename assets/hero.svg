    <text x="56" y="306" font-size="20" fill="#b9c3d6">AI 助手写好各平台文案、适配封面，</text>
    <text x="56" y="336" font-size="20" fill="#b9c3d6">再逐个平台直接提交，每一步都有回执。</text>
    <rect x="56" y="372" width="504" height="84" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.16"/>
