name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          python -m pip check
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m build --wheel
      - name: Install built wheel and smoke-test CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m video_publisher --help
          vpub --help
          bili --version
          python -c "import bili_cli, pathlib; assert (pathlib.Path(bili_cli.__file__).parent / '_skills/bili-cli/SKILL.md').is_file()"
