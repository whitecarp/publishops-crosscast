[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "publishops-crosscast"
version = "0.16.0"
description = "Multi-platform video release operations console"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "src/bili_cli/LICENSE"]
authors = [{ name = "whitecarp" }]
keywords = ["video", "publishing", "bilibili", "cross-platform", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Pillow>=11,<14",
  "bilibili-api-python==17.4.2",
  "typer>=0.12",
  "qrcode[pil]>=7.4",
  "httpx>=0.27",
  "curl_cffi>=0.7",
  "patchright==1.58.2",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]

[project.scripts]
vpub = "video_publisher.cli:main"
bili = "bili_cli.main:main"

[project.urls]
Homepage = "https://github.com/whitecarp/publishops-crosscast"
Repository = "https://github.com/whitecarp/publishops-crosscast"
Issues = "https://github.com/whitecarp/publishops-crosscast/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bili_cli = ["LICENSE", "_skills/**/*"]

[tool.setuptools.data-files]
"share/publishops-crosscast" = ["NOTICE.md", "README.md", "README_EN.md", "README_ZH_TW.md"]
"share/publishops-crosscast/assets" = ["assets/*.svg"]
"share/publishops-crosscast/docs" = ["docs/.nojekyll", "docs/*.md", "docs/index.html", "docs/site.css", "docs/site.js"]
"share/publishops-crosscast/skills/publishops-crosscast" = ["skills/publishops-crosscast/SKILL.md"]

