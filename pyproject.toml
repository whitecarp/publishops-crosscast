[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "publishops-crosscast"
version = "0.3.0"
description = "Multi-platform video release operations console"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "whitecarp" }]
keywords = ["video", "publishing", "bilibili", "cross-platform", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Pillow>=11,<14",
  "bili-agent==0.7.0",
  "google-api-python-client==2.201.0",
  "google-auth-oauthlib==1.5.0",
  "patchright==1.58.2",
  "loguru==0.7.3",
  "qrcode==8.2",
  "segno==1.6.6",
  "opencv-python==5.0.0.93",
]

[project.scripts]
vpub = "video_publisher.cli:main"

[project.urls]
Homepage = "https://github.com/whitecarp/publishops-crosscast"
Repository = "https://github.com/whitecarp/publishops-crosscast"
Issues = "https://github.com/whitecarp/publishops-crosscast/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/publishops-crosscast" = ["NOTICE.md", "README.md", "README_EN.md", "README_ZH_TW.md"]
"share/publishops-crosscast/assets" = ["assets/*.svg"]
"share/publishops-crosscast/docs" = ["docs/.nojekyll", "docs/*.md", "docs/index.html", "docs/site.css", "docs/site.js"]
"share/publishops-crosscast/skills/publishops-crosscast" = ["skills/publishops-crosscast/SKILL.md"]

